[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "separatrix-calibration-demo"
version = "0.2.0"
description = "Reproducible audit of entropy-driven separatrix refinement: unreachable islands, unresolved peninsulas, and a metric-population trap (Newton fractal of arXiv:2608.14743)."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
keywords = ["basins of attraction", "separatrix", "uncertainty quantification",
            "monte-carlo dropout", "generative modelling", "dynamical systems"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
authors = [{name = "Mingkang Zhao", email = "lingjichen@foxmail.com"}]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
gpu = ["torch>=2.0"]
test = ["pytest>=7"]
dev = ["pytest>=7"]

[project.urls]
Source = "https://github.com/Iristtspinnnnng/separatrix-calibration-demo"
Paper = "https://arxiv.org/abs/2608.14743"

[tool.setuptools]
packages = ["separatrix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
